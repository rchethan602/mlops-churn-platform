name: AWS OIDC Smoke Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws-trust:
    runs-on: mlflow-runner

    env:
      AWS_REGION: eu-central-1
      S3_BUCKET: mlops-churn-dataset

    steps:
      - name: Install AWS CLI v2 without root
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin" "$HOME/aws-cli"

          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) AWS_ARCH="x86_64" ;;
            aarch64|arm64) AWS_ARCH="aarch64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac

          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${AWS_ARCH}.zip" -o "/tmp/awscliv2.zip"
          unzip -q /tmp/awscliv2.zip -d /tmp

          /tmp/aws/install -i "$HOME/aws-cli" -b "$HOME/bin" --update

          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/aws" --version

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm identity AWS sees us as
        shell: bash
        run: |
          aws sts get-caller-identity

      - name: Confirm S3 bucket access
        shell: bash
        run: |
          aws s3 ls "s3://${S3_BUCKET}/"

      - name: Confirm ECR auth works
        shell: bash
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" > /dev/null
          echo "ECR auth OK"
