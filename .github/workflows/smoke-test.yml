name: AWS OIDC Smoke Test

# Manual trigger only - this workflow exists purely to validate the
# GitHub -> AWS OIDC trust chain before any real pipeline depends on it.
on:
  workflow_dispatch:

permissions:
  id-token: write   # required: lets GitHub mint the OIDC token for this run
  contents: read

jobs:
  verify-aws-trust:
    runs-on: mlflow-runner
    steps:
      - name: Confirm identity AWS sees us as
        run: aws sts get-caller-identity

      - name: Confirm S3 bucket access (read-only list)
        run: aws s3 ls s3://mlops-churn-dataset/

      - name: Confirm ECR auth works
        run: aws ecr get-login-password --region eu-central-1 > /dev/null && echo "ECR auth OK"