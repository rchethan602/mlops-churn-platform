apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vehicle-predictive-maintenance-predictor
  namespace: mlops-serving
  labels:
    # REQUIRED - matches Prometheus's serviceMonitorSelector/podMonitorSelector
    release: kube-prom
spec:
  selector:
    matchLabels:
      app: isvc.vehicle-predictive-maintenance-predictor
  namespaceSelector:
    matchNames:
      - mlops-serving
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s